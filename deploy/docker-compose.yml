# queryforge local stack.
#
# Ports are offset (5434/6381/9096) so this runs alongside other projects.
#
# Two logical databases live in one Postgres instance:
#   queryforge — this service's own jobs and measurement history
#   shop       — the benchmark database whose queries get optimised
#
# In a real deployment the target is somebody else's database, and it should be
# a replica: index experiments briefly take an exclusive lock on the table they
# build against.
name: queryforge

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: queryforge
      POSTGRES_PASSWORD: queryforge
      POSTGRES_DB: queryforge
      # shared_buffers and work_mem are raised because the benchmark is about
      # plan quality; leaving them at the defaults means every query is dominated
      # by I/O and the differences between plans disappear into the noise.
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=16MB
      - -c
      - max_connections=50
      - -c
      - track_io_timing=on
    ports: ["5434:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-shop.sh:/docker-entrypoint-initdb.d/10-init-shop.sh:ro
      - ../testdata/schema/seed.sql:/seed/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queryforge -d queryforge"]
      interval: 5s
      timeout: 3s
      retries: 30

  # MySQL is opt-in: `docker compose --profile mysql up -d mysql`.
  #
  # It is not in the default stack because the Postgres path is the one that can
  # *measure* an index experiment, and starting a second 1.5M-row database by
  # default would double the seed time for a demo that does not need it.
  mysql:
    profiles: ["mysql"]
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: queryforge
      MYSQL_DATABASE: shop
      MYSQL_USER: queryforge
      MYSQL_PASSWORD: queryforge
    command:
      - --innodb-buffer-pool-size=512M
      # The benchmark is about plan quality. Left at the defaults, every query is
      # dominated by I/O and the differences between plans vanish into noise —
      # the same reasoning as the Postgres service above.
      - --performance-schema=ON
    ports: ["3307:3306"]
    volumes:
      - mysqldata:/var/lib/mysql
      - ../testdata/schema/seed-mysql.sql:/docker-entrypoint-initdb.d/10-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uqueryforge", "-pqueryforge"]
      interval: 5s
      timeout: 3s
      retries: 60

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["6381:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0
    ports: ["9096:9096"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: EXTERNAL://:9096,CONTROLLER://:9093,INTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9096,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: queryforge-local-cluster
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { TARGET: api }
    ports: ["8082:8082"]
    environment:
      METADATA_DSN: postgres://queryforge:queryforge@postgres:5432/queryforge?sslmode=disable
      TARGET_DSN: postgres://queryforge:queryforge@postgres:5432/shop?sslmode=disable
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:29092
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      kafka:    { condition: service_healthy }

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { TARGET: worker }
    environment:
      METADATA_DSN: postgres://queryforge:queryforge@postgres:5432/queryforge?sslmode=disable
      TARGET_DSN: postgres://queryforge:queryforge@postgres:5432/shop?sslmode=disable
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:29092
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      MEASUREMENT_RUNS: ${MEASUREMENT_RUNS:-5}
      MIN_IMPROVEMENT_PCT: ${MIN_IMPROVEMENT_PCT:-10}
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      kafka:    { condition: service_healthy }

volumes:
  pgdata:
  mysqldata:
